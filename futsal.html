<!doctype html>
<html lang="pt-BR">

    <title>Vídeo YouTube</title>
  </head>
  <body>
    <h1>Meu Vídeo</h1>

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/BKzfnyR_QZ8?si=GWYpxdclblWSqIaF"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"

    </iframe>

    <p>
      O futsal surgiu no Uruguai, em 1930. O esporte foi criado para ser jogado
      em quadras menores.
    </p>

    <p>
      Rapidamente o futsal ficou famoso na América do Sul, principalmente no
      Brasil.
    </p>

    <p>
      Muitos jogadores famosos do futebol começaram jogando futsal, como Pelé,
      Ronaldinho e Neymar.
    </p>

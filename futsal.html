    <h1>História do Futsal</h1>

    <p>
      O futsal surgiu no Uruguai, em 1930. O esporte foi criado para ser jogado
      em quadras menores.
    </p>

    <p>
      Rapidamente o futsal ficou famoso na América do Sul, principalmente no
      Brasil.
    </p>

    <p>
      Muitos jogadores famosos do futebol começaram jogando futsal, como Pelé,
      Ronaldinho e Neymar.
    </p>
